# How a benchmark run is shaped. Machine paths and keys are not here (see .env.example).
mode: diff-only                 # one call per pull request: the diff and the changed files, no tools
sets:
  full: data/sets/full.json     # the fifty
  frontier: data/sets/frontier.json   # ten of the fifty, chosen by `crbench data`
repeats: 1                      # the default; the published results pass --repeats 1-3
prompt:
  system: configs/prompts/review_system.md
  user: configs/prompts/review_user.md
  file_chars_max: 60000         # a changed file longer than this is shown as its patch only
  files_chars_budget: 500000    # total characters of full file contents per prompt; the largest files drop to patch-only first
  patch_chars_max: 40000        # a patch longer than this is cut, with a marker
max_output_tokens: 65536        # the ceiling for thinking plus the answer, every route
timeout_seconds: 3600           # per attempt (2026-10-17, was 1500): Kimi K3 needed 1,370 s on the largest PR; the 65k output cap, not the clock, should bind
parse_retries: 2                # a reply that is not the JSON asked for (or cut at the output cap) is asked again, at most twice (2026-10-17, was once)
concurrency:                    # calls in flight: per model, and per route over all its models
  per_model: 4                   # 6 for the run of claude-sonnet-5 and claude-opus-5 only (throughput), 4 otherwise
  bedrock-anthropic: 12
  bedrock-openai: 16
  openrouter: 24
