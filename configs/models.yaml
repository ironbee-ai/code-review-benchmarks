# The contestants. One entry per model; `tiers` map the benchmark's three effort tiers to the provider's parameter.
# `{}` sends no effort parameter (the vendor default). No tier ever sends `max`: where a vendor's default is max,
# the default tier is xhigh. `same_as` marks a tier that is the same configuration as another
# one and is not run twice. Routes: bedrock-anthropic (Messages API), bedrock-openai (Bedrock's OpenAI-compatible chat
# endpoint), openrouter. Model ids are the provider's; prices live in pricing.yaml.
tiers: [low, default, xhigh]
models:
  - id: claude-opus-5.5
    family: anthropic
    route: bedrock-anthropic
    model: global.anthropic.claude-opus-5-5
    tiers: { low: { effort: low }, default: {}, xhigh: { effort: xhigh } }
    sets: [full]
  - id: claude-sonnet-5.5
    family: anthropic
    route: bedrock-anthropic
    model: global.anthropic.claude-sonnet-5-5
    tiers: { low: { effort: low }, default: {}, xhigh: { effort: xhigh } }
    sets: [full]
  - id: claude-haiku-5.5
    family: anthropic
    route: bedrock-anthropic
    model: global.anthropic.claude-haiku-5-5
    tiers: { low: { effort: low }, default: {}, xhigh: { effort: xhigh } }
    sets: [full]
  - id: claude-sonnet-5
    family: anthropic
    route: bedrock-anthropic
    model: global.anthropic.claude-sonnet-5
    # The previous generation, added after pass 3 (2026-10-18; all three levels, repeats 1-3), to see what a
    # generation adds.
    tiers: { low: { effort: low }, default: {}, xhigh: { effort: xhigh } }
    sets: [full]
  - id: claude-opus-5
    family: anthropic
    route: bedrock-anthropic
    model: global.anthropic.claude-opus-5
    # As claude-sonnet-5: the previous generation, added after pass 3.
    tiers: { low: { effort: low }, default: {}, xhigh: { effort: xhigh } }
    sets: [full]
  - id: claude-fable-5.1
    family: anthropic
    route: bedrock-anthropic
    model: global.anthropic.claude-fable-5-1
    tiers: { low: { effort: low }, default: {}, xhigh: { effort: xhigh } }
    sets: [frontier]
  - id: gpt-6.1-sol
    family: openai
    route: bedrock-openai
    model: global.openai.gpt-6.1-sol
    tiers: { low: { reasoning_effort: low }, default: {}, xhigh: { reasoning_effort: xhigh } }
    sets: [full]
  - id: gpt-5.6-terra
    family: openai
    route: bedrock-openai
    model: global.openai.gpt-5.6-terra
    tiers: { low: { reasoning_effort: low }, default: {}, xhigh: { reasoning_effort: xhigh } }
    sets: [full]
  - id: gpt-6-luna
    family: openai
    route: bedrock-openai
    model: global.openai.gpt-6-luna
    tiers: { low: { reasoning_effort: low }, default: {}, xhigh: { reasoning_effort: xhigh } }
    sets: [full]
  - id: gpt-6-astra
    family: openai
    route: bedrock-openai
    model: global.openai.gpt-6-astra
    tiers: { low: { reasoning_effort: low }, default: {}, xhigh: { reasoning_effort: xhigh } }
    sets: [frontier]
  - id: muse-spark-1.3
    family: meta
    route: openrouter
    model: meta/muse-spark-1.3
    # xhigh was first set same_as default ("the public tier is xhigh"): wrong. A probe on 2026-10-18 (sentry__93824)
    # wrote 12,313 output tokens at xhigh against ~4,300 at the default in passes 1-3, so xhigh is its own tier,
    # run after pass 3 for repeats 1-3.
    tiers: { low: { reasoning: { effort: low } }, default: {}, xhigh: { reasoning: { effort: xhigh } } }
    sets: [full]
  - id: muse-wonder
    family: meta
    route: openrouter
    model: meta/muse-wonder
    # Meta's higher-priced model (released 2026-10-12), added after pass 3 (2026-10-19; low, default and xhigh, three repeats).
    # Probe on sentry__93824: low 3,142 output tokens, default (no effort sent) 5,442, xhigh 15,274: its default is not xhigh.
    tiers: { low: { reasoning: { effort: low } }, default: {}, xhigh: { reasoning: { effort: xhigh } } }
    sets: [full]
  - id: deepseek-v4-pro
    family: deepseek
    route: openrouter
    model: deepseek/deepseek-v4-pro-0813
    # DeepSeek's own API (reachable since the OpenRouter account allows endpoints that may train on inputs). On the
    # trial PR: low 236 s, high 327 s. Together cut long generations and maps low to high; StreamLake also answers
    # (high 580 s). With no level sent the first-party endpoint ran into the 65,536 cap, so every tier names its level.
    provider: { order: [deepseek], allow_fallbacks: false }
    # DeepSeek's levels are low, high, max (default high). xhigh maps to max on DeepSeek; the benchmark never sends
    # max, so xhigh is the default tier.
    tiers: { low: { reasoning: { effort: low } }, default: { reasoning: { effort: high } }, xhigh: { same_as: default } }
  - id: deepseek-v4.1-flash
    family: deepseek
    route: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    # Added after pass 3 (2026-10-18): the 2026-10-17 snapshot on DeepSeek's own endpoint, all three repeats run at
    # once. Levels as V4 Pro: low, high, max (never max). Probe on sentry__93824: low 21.8k output tokens 98 s, high 28.0k 120 s.
    provider: { order: [deepseek], allow_fallbacks: false }
    tiers: { low: { reasoning: { effort: low } }, default: { reasoning: { effort: high } }, xhigh: { same_as: default } }
    sets: [full]
  - id: qwen3.8-max
    family: alibaba
    route: openrouter
    model: qwen/qwen3.8-max-0902
    provider: { order: [alibaba], allow_fallbacks: false }
    tiers: { low: { reasoning: { effort: low } }, default: {}, xhigh: { reasoning: { effort: xhigh } } }
    sets: [full]
  - id: glm-5.3
    family: zai
    route: openrouter          # Bedrock's GLM 5.3 is limited to eligible accounts (403 for ours); Z.AI's own endpoint instead
    model: z-ai/glm-5.3
    provider: { order: [z-ai], allow_fallbacks: false }
    # Z.AI's levels are low, high, max (default max); the benchmark never sends max, so the default tier is high
    tiers: { low: { reasoning: { effort: low } }, default: { reasoning: { effort: high } }, xhigh: { same_as: default } }
    sets: [full]
  - id: kimi-k3
    family: moonshot
    route: bedrock-openai
    model: global.moonshotai.kimi-k3
    tiers: { low: { reasoning_effort: low }, default: {}, xhigh: { reasoning_effort: xhigh } }
    sets: [full]
  - id: minimax-m3
    family: minimax
    route: openrouter
    model: minimax/minimax-m3
    provider: { order: [minimax], allow_fallbacks: false }
    tiers: { low: { reasoning: { effort: low } }, default: {}, xhigh: { reasoning: { effort: xhigh } } }
    sets: [full]
  - id: gemini-4-argon
    family: google
    route: openrouter
    model: google/gemini-4-argon
    provider: { order: [google-ai-studio], allow_fallbacks: false }
    tiers: { low: { reasoning: { effort: low } }, default: {}, xhigh: { reasoning: { effort: high } } }   # Gemini's top level is high
    sets: [full]
  - id: mistral-large-4
    family: mistral
    route: openrouter
    model: mistralai/mistral-large-4-0
    provider: { order: [mistral, mistral/eu], allow_fallbacks: false }
    # mistral/eu: Mistral's own EU endpoint, used when the main one is rate-limited upstream (it was, for ~30 minutes, on 2026-10-16).
    # Reasoning on is left out of the benchmark (2026-10-17). Through OpenRouter (any effort, a budget, any temperature)
    # it never answered on the trial PR within the 65k output cap or 25 minutes. Through Mistral's own API it answered
    # on the trial PR after 19 minutes and 61k output tokens (59k of them reasoning), and looped without an answer on
    # the smallest PR. Reasoning off answers (17 findings, 106 s). Details in the write-up's operations section.
    tiers:
      low: { reasoning: { effort: none } }
      default: { skip: "reasoning on: 19 min and 61k output tokens on the trial PR, no answer in 25 min on the smallest (it loops)" }
      xhigh: { skip: "reasoning on: as default" }
    sets: [full]
  - id: grok-4.7
    family: xai
    route: openrouter
    model: x-ai/grok-4.7
    # xAI's own API through OpenRouter (2026-10-17, during pass 1). On Bedrock (global and US profiles) long requests
    # stopped answering from 14:26 local: no byte for 25+ minutes, while the same request to xAI answered in 369 s and
    # Bedrock's short judge calls kept working. Every tier moved, so all of Grok's reviews come from one host. Grok the
    # judge stays on Bedrock.
    provider: { order: [xai], allow_fallbacks: false }
    tiers: { low: { reasoning: { effort: low } }, default: {}, xhigh: { reasoning: { effort: xhigh } } }
    sets: [full]
