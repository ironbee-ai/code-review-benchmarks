# The judge pool, in order. A contestant is judged by the first three judges whose family is not its own, through the
# benchmark's own steps (dedup, judge), and the three vote. The steps talk to a local proxy
# (crbench/judge_proxy.py) that sends each call on the judge's route with `params` added and `drop` removed, and logs
# its usage and cost. `model` is what the benchmark's MARTIAN_MODEL sees (and names the results directory).
# Judges run at low reasoning effort: the benchmark's step gives every match call 30 seconds.
# Order (2026-10-17): Gemini, GPT-6.1 Sol, Opus first; Grok only where one of them is the contestant's
# own family. Claude models: Gemini, Sol, Grok. GPT models: Gemini, Opus, Grok. Gemini: Sol, Opus, Grok. Grok: Gemini,
# Sol, Opus. Every other model: Gemini, Sol, Opus.
pool:
  - id: gemini-4-argon
    family: google
    route: openrouter
    model: google/gemini-4-argon
    params: { reasoning: { effort: low }, provider: { order: [google-ai-studio], allow_fallbacks: false } }
  - id: gpt-6.1-sol
    family: openai
    route: bedrock-openai
    model: global.openai.gpt-6.1-sol
    params: { reasoning_effort: low }
    drop: [temperature]
  - id: claude-opus-5.5
    family: anthropic
    route: bedrock-anthropic
    model: global.anthropic.claude-opus-5-5
    params: { effort: low }
    drop: [temperature]          # deprecated on this model: the step's temperature 0.0 is refused
  - id: grok-4.7               # the stand-in where Sol or Opus is the contestant's own family
    family: xai
    route: bedrock-openai
    model: global.xai.grok-4.7
    params: { reasoning_effort: low }
# Observers judge every contestant too but do not vote. None: Mistral Large 4 observed the one-PR trial (2026-10-16)
# and was dropped on 2026-10-17 (the four-judge panel is enough; it was also the most rate-limited judge).
observers: []
per_candidate: 3
# the dedup step (one LLM call per review) runs once with the triple's first judge; its groups are shared by all
dedup_with: first
