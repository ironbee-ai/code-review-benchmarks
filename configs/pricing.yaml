# List prices in USD per 1M tokens, the rate the benchmark bills every run at (read on 2026-10-16, checked on 2026-10-17
# against the Bedrock model cards, Anthropic's and DeepSeek's pricing pages and OpenRouter's endpoint listing). The rule:
# the standard on-demand rate on the route we call (Bedrock: global cross-Region inference), with no time-of-day, flex
# or batch discount. Reported costs (OpenRouter's usage.cost) are kept beside the computed ones. null = unknown: the
# report flags the model instead of guessing. `long_context`: the rates a request pays, for all of its tokens, when its
# prompt (input + cache reads + cache writes) is over `over` tokens.
models:
  claude-opus-5.5:   { input: 4.00,  output: 20.00, cache_read: 0.20,  cache_write: 5.00 }
  claude-sonnet-5.5: { input: 2.00,  output: 10.00, cache_read: 0.10,  cache_write: 2.50 }
  claude-opus-5:     { input: 5.00,  output: 25.00, cache_read: 0.50,  cache_write: 6.25 }    # added 2026-10-18 (Anthropic's list, as OpenRouter mirrors it)
  claude-sonnet-5:   { input: 2.00,  output: 10.00, cache_read: 0.20,  cache_write: 2.50 }    # added 2026-10-18 (Anthropic's list, as OpenRouter mirrors it)
  claude-haiku-5.5:  { input: 0.10,  output: 0.50,  cache_read: 0.01,  cache_write: 0.125,
                       long_context: { over: 100000, input: 0.50, output: 2.50, cache_read: 0.05, cache_write: 0.625 } }
  claude-fable-5.1:  { input: 10.00, output: 50.00, cache_read: 0.25,  cache_write: 12.50 }
  gpt-6-astra:       { input: 10.00, output: 50.00, cache_read: 1.00,  cache_write: 12.50,
                       long_context: { over: 272000, input: 20.00, output: 75.00, cache_read: 2.00, cache_write: 25.00 } }
  gpt-6.1-sol:       { input: 2.00,  output: 10.00, cache_read: 0.10,  cache_write: 2.50,
                       long_context: { over: 272000, input: 4.00, output: 15.00, cache_read: 0.20, cache_write: 5.00 } }
  gpt-6-luna:        { input: 0.10,  output: 0.50,  cache_read: 0.01,  cache_write: 0.125,
                       long_context: { over: 272000, input: 0.20, output: 0.75, cache_read: 0.02, cache_write: 0.25 } }
  gpt-5.6-terra:     { input: 2.00,  output: 12.00, cache_read: 0.20,  cache_write: 2.50 }     # long-context rate not confirmed (its model card did not load); no PR comes near 272k tokens for GPT
  glm-5.3:           { input: 1.40,  output: 4.40,  cache_read: 0.26,  cache_write: null }    # Z.AI first party
  kimi-k3:           { input: 3.00,  output: 15.00, cache_read: 0.30,  cache_write: 3.75 }    # Bedrock global
  grok-4.7:          { input: 2.00,  output: 6.00,  cache_read: 0.50,  cache_write: null,     # xAI (and Bedrock global)
                       long_context: { over: 199999, input: 4.00, output: 12.00, cache_read: 1.00 } }   # xAI, prompts of 200k tokens or more
  deepseek-v4-pro:   { input: 1.32,  output: 3.96,  cache_read: 0.044, cache_write: null }    # DeepSeek's standard (peak) rate; off-peak hours bill half, which is what OpenRouter reports for runs made then
  deepseek-v4.1-flash: { input: 0.15,  output: 0.60,  cache_read: 0.003, cache_write: null }    # DeepSeek's endpoint on OpenRouter (2026-10-18)
  qwen3.8-max:       { input: 2.00,  output: 6.00,  cache_read: 0.25,  cache_write: 2.50 }    # one rate over the whole 1M context
  minimax-m3:        { input: 0.30,  output: 1.20,  cache_read: 0.06,  cache_write: null }
  muse-wonder:       { input: 4.00,  output: 20.00, cache_read: 0.20,  cache_write: null }    # Meta's endpoint on OpenRouter (2026-10-19)
  muse-spark-1.3:    { input: 1.25,  output: 4.25,  cache_read: 0.15,  cache_write: null }
  gemini-4-argon:    { input: 2.00,  output: 10.00, cache_read: 0.10,  cache_write: null }    # introductory until 2026-11-30, then 4.00 / 20.00
  mistral-large-4:   { input: 0.68,  output: 2.09,  cache_read: 0.07,  cache_write: null }
