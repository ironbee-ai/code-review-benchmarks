[project]
name = "crbench"
version = "0.1.0"
description = "Code review benchmarks: raw models on Martian's offline Code Review Bench, judged by its own pipeline"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31,<4",
    "anthropic>=1.15,<2",
    "pyyaml>=6",
    "httpx>=0.27",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
charts = ["matplotlib>=3.9", "pillow>=10"]   # scripts/blog_figures.py

[project.scripts]
crbench = "crbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crbench"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
